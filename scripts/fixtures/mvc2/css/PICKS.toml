# PICKS.toml - the team the CSS tour picks, as DATA. `[2026-09-18]`
#
# THE TEAM IS OURS, NOT DAVID'S. David's Dhalsim97 macro reaches a tag (his
# `at2CharTag` marker), so at least two of his three characters matter - but his
# files never name them, and inferring them by replaying his P2-lane cursor letters
# over the DC globe is unreliable (his PS2 walk starts from a different menu state;
# measured: his whole macro booted from power-on lands in Training on the wrong
# cast). So the base carries a team WE chose, labeled as such: Dhalsim on point is
# the only requirement the finding step needs.
#
# The pick strings are David's charselect.py notation: <char>-<palette>-<assist>,
# palette in LP/HP/A1/LK/HK/A2 (the button that SELECTS the character = the in-match
# colour), assist A/B/C (alpha/beta/gamma; Assist_Value 0/1/2). The letter stream in
# dhalsim_team_picks.txt was generated by his build_picks()+merge_players() on his
# TIMING table; css.cpp's port must reproduce it byte for byte (CSS SELFTEST).
schema = 1

[seed]
file    = "seed_globe.txt"       # fastVS_mcp (697, David's DC boot seed) + 45 neutral
frames  = 742
hash    = "8a5fd2a82ca86543"     # seqHashMacro (fixtures-check.sh F1's rule)
handoff = 742                    # dojo:OnEnterHandoff - the pause lands ON the globe

[picks]
file     = "dhalsim_team_picks.txt"
frames   = 378
hash     = "3b736c94ef884bbd"
p1       = ["Dhalsim-LP-A", "Cable-LP-A", "Sentinel-LP-A"]
p2       = ["Ryu-LP-A", "Ken-LP-A", "Guile-LP-A"]
owner    = "ours (not David's)"
timing   = "navgap=1 preselect=8 postsel=24 astgap=12 preconf=12 postconf=72"   # David's TIMING, verbatim

[expect]
# ID_2 per slot after both teams lock (David's NAMES table == SPREADSHEET ID_2 Note2).
# `[MEASURED 2026-09-18]` on this build from power-on, first try: 37/23/52 vs 0/39/2.
p1_a = 37   # Dhalsim
p1_b = 23   # Cable
p1_c = 52   # Sentinel
p2_a = 0    # Ryu
p2_b = 39   # Ken
p2_c = 2    # Guile
# the P1 walk RubyHeart -> Dhalsim, David's plan() = D,L,L,L; the intermediate cursor
# IDs the tour must read after each press (his verify_grid claim, on DC):
walk_path = ["Hayato", "Anakaris", "Jin", "Dhalsim"]
walk_ids  = [18, 4, 55, 37]
