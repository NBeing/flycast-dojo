# RECIPE.toml - the MvC2 combo fixture, pinned. `[2026-09-17]`
#
# NEVER REGENERATE THIS FILE TO MAKE A RED GATE GREEN. A pin that moved is a
# finding, not a chore: either the emulator changed (a bug, or a change that must
# be understood and named) or the fixture's inputs changed (then the RECIPE says
# which ones, by hash, and the old pin is kept in git). `fixtures-check.sh
# --regenerate` refuses without FIXTURES_REGENERATE=iknow, rewrites ONLY the
# no-emulator pins it can recompute, and prints every before/after.
#
# Two disciplines lifted from nbneo-rr's fixture rules:
#   - a result is pinned by TWO hashes: the machine hash AND the game byte (the
#     combo counter). "The picture can be identical while the state is not."
#   - the PHASE is part of the result. MvC2 skips every 4th frame; a combo that
#     straddles a skip boundary connects on ONE of four phases (David measured
#     "~1/4 of the time"). A fixture that does not pin its phase is ~75% flaky.
#
# HONESTY: every field whose value is the string "unmeasured" has NOT been measured
# on this build. The hunt (core/dojo/combohunt.cpp, dojo:ComboHunt) fills them and
# records `measured_on` beside them; fixtures-check.sh lists them on every run so an
# unmeasured fixture can never read as a pinned one.

#
# WHAT THE BASE IS, AND IS NOT. `[MEASURED 2026-09-18]` the user, watching the v4 tour:
# "we don't have the right save state for this combo" - and then, of every clip on
# this machine: "none of those are from me". The tour's BASE (slot 0 of the newest clip
# under replays/, 2026-09-08T02_38_29Z @ frame 9928, Sonson vs Marrow) was written by
# scripts/testrun.sh on 2026-09-07 - a HARNESS ARTIFACT, not David's and not the user's.
# David ships NO Dreamcast savestates (his .p2m movies are PS2 power-on input grids; the
# 4D228733.* states his markers name never left his machine; nothing under davids_fly,
# newest_checkout (empty) or fbneo-rr holds one - searched by name, extension and magic).
# So the "combo" this RECIPE pins is David's Combo_Dhalsim97 INPUT STREAM driving SONSON:
# the byte moves (peak 19 - a real, arm-proven measurement of the studio's plumbing) but
# it is NOT Dhalsim's combo. Booting his whole macro from power-on lands in Training on
# the wrong cast (his PS2 menu timing does not transfer). A base with Dhalsim on point
# must be AUTHORED on DC or RECORDED by a human; until then every claim below is "the
# stream lands 19 on the harness base", never "David's combo connects".
#
# `[2026-09-18]` AUTHORED IT IS: David's own character-select utility (0915/flycast-rr/
# mcp/charselect.py - the globe as a torus, plan(), build_picks(), his timing table,
# verified by him on DC 2026-09-12) works on this build from power-on, first try:
# fastVS_mcp + the picks below -> ID_2 37/23/52 vs 0/39/2, Start at SPEED SELECT ->
# in-match, Dhalsim on point. [dhalsim_base] below is that recipe - inputs only, no
# savestate to ship (a state is V49-locked; the inputs survive any version). The team
# is OURS, not his (see css/PICKS.toml). The machine hash it lands on is measured by
# `scripts/csstour.sh` and pinned by `fixtures-check --make-dhalsim-base`; until then
# it says "unmeasured". Whether his Dhalsim97 rows connect on it is the CSS tour's
# FINDING step - reported, never a pass condition.
schema = 1

[rom]
# Identity is the file's bytes, not its name: three copies of NoBGM_VMU.cdi live on
# this machine and the RECIPE must not care which one booted. `game_dir` is what
# Replay::get_game_name() folders replays under - the tree's own ROM label.
file     = "NoBGM_VMU.cdi"
size     = 794236079
sha256   = "e30be4d3deedd140efc3b79b53e8738281eb5d386b8f0dd67694df56ee6535bb"
game_dir = "Marvel vs. Capcom 2 (USA)"

[vmu]
# THE FIXTURE IS THE ROM *AND* THE VMU. `[MEASURED 2026-09-17]` with the seed wired,
# F4 still failed: the seed presses Start at frame 119, and a screenshot at 118
# showed the VMU prompt ("A Memory Card with 5 blocks ... Press the Start button to
# create a file") - a sandbox's fresh XDG_DATA_HOME has an EMPTY VMU, the whole
# menu flow shifts one screen, and every seed press lands on the wrong screen.
# David's seeds presume a card that already holds the MvC2 save. The card is a
# RECIPE, not an artifact: `fixtures-check --make-vmu` boots THIS build on an empty
# card, presses Start once on the prompt ("A file has been created."), accepts the
# card only if F4 passes on it, and pins it by bytes. `[MEASURED 2026-09-17]` two
# makes gave the same md5 - the card is byte-deterministic. Staged into
# <XDG_DATA_HOME>/flycast-dojo/ before boot.
file   = "vmu_save_A1.bin"
size = 131072
md5 = "de5110ca408f30398762c1b32ad8881d"
source = "fixtures-check --make-vmu (2026-09-17): this build, one Start on the create-save prompt, accepted by F4"

[vocabulary]
# David's DC-verified address vocabulary. Every address the fixture reads is
# resolved BY NAME through this file at run time; the two addresses below are
# pinned so a re-keyed spreadsheet is caught, not silently followed.
spreadsheet        = "core/dojo/mvc2_data/SPREADSHEET.json"
spreadsheet_md5    = "23c1827fc4fe3b04313ee8c944565b20"
combo_field        = "Combo_Meter_HitsToOpponent"   # the DC-verified combo byte
combo_p1_a         = "0x2C2685A0"                    # what mvc2.cpp hardcodes; must agree
combo_p2_a         = "0x2C268B44"
cursor_field       = "ID_2"                          # char-select cursor, per point char
cursor_p1_a        = "0x2C268341"

[base]
# The savestate-free base: David's DC-native boot snippet, power-on -> VS mode.
# No savestate => no V48/V49 round-trip, no RTC, no dead timeline. Frames and the
# hash are seqHashMacro's (FNV-1a 64 over each frame's p1,p2 canon u16 - the
# library.json index's own hash) and are recomputed by fixtures-check.sh from the
# .txt with no emulator.
kind          = "snippet"
boot_seed     = "snippets/fastVS.txt"       # handoff on STAGE SELECT
boot_frames   = 633
boot_hash     = "4db6bf3690958f6b"
globe_seed    = "snippets/fastVS_mcp.txt"   # + LK x4 at 634..637: picks the stage -> the char-select globe
globe_frames  = 697
globe_hash    = "442574011190bd6b"
# `[MEASURED 2026-09-17]` library.json's entry for fastVS_mcp.txt still says
# 633 / 4db6bf3690958f6b - the boot seed's numbers. The index went stale when the
# file grew (David's own comment on Rescan: "frames/players/hash went stale"), which
# is exactly why this RECIPE pins the .txt and not the index.
# THE HUNT'S BASE `[MEASURED 2026-09-17]`: not the boot seed after all - slot 0 of the
# tour's clip (David's V48 state; Sonson(B) vs Marrow(B), IN A MATCH, skip=1/4). The
# boot seeds reach the globe, not a fight; the combo needs a fight. The hash is
# oracle::machineHash AFTER the load on this build (XXH32, 8 hex) - never the V48
# file's digest, which cannot round-trip under V49.
# `[2026-09-18]` UNMEASURED AGAIN: 27FA5D20 @ 9928 was the HARNESS base (Sonson vs Marrow,
# a testrun.sh artifact - 404543fcf). The base that stands is [dhalsim_base] (5FC481A7).
# `[2026-09-18, later]` the base that stands: [dhalsim_base], authored by the CSS tour
# (scripts/csstour.sh / fixtures-check.sh --make-dhalsim-base), byte-deterministic.
machine_hash  = "5FC481A7"
machine_frame = 2059
machine_slot  = 0

[dhalsim_base]
# The AUTHORED base: power-on -> the globe (the seed) -> both teams picked (the picks,
# David's utility) -> Start at SPEED SELECT -> the first playable frame, saved as slot 0
# by the CSS tour (core/dojo/css_tour.cpp) and copied out by scripts/csstour.sh
# --keep-base. Pinned by inputs (two seqHashMacro) AND by the machine it lands on.
kind        = "authored"
seed        = "css/seed_globe.txt"
seed_frames = 742
seed_hash   = "8a5fd2a82ca86543"
picks       = "css/dhalsim_team_picks.txt"
picks_frames = 378
picks_hash  = "3b736c94ef884bbd"
handoff     = 742                  # dojo:OnEnterHandoff: the pause lands ON the globe
team_p1     = ["Dhalsim-LP-A", "Cable-LP-A", "Sentinel-LP-A"]
team_p2     = ["Ryu-LP-A", "Ken-LP-A", "Guile-LP-A"]
team_owner  = "ours (not David's)"
# ID_2 per slot once both teams lock - names validated against SPREADSHEET ID_2 Note2.
id2_p1_a    = 37   # Dhalsim
id2_p1_b    = 23   # Cable
id2_p1_c    = 52   # Sentinel
id2_p2_a    = 0    # Ryu
id2_p2_b    = 39   # Ken
id2_p2_c    = 2    # Guile
name_p1_a   = "Dhalsim"
name_p1_b   = "Cable"
name_p1_c   = "Sentinel"
name_p2_a   = "Ryu"
name_p2_b   = "Ken"
name_p2_c   = "Guile"
# the machine the tour saves as slot 0 (oracle::machineHash, 8 hex) and its frame -
# filled by `fixtures-check --make-dhalsim-base` from the tour's `CSS BASE:` line.
machine_hash = "5FC481A7"
machine_frame = 2059
measured_on = "fixtures-check --make-dhalsim-base (2026-09-18): scripts/csstour.sh on this build, slot 0 @ 2059"

[charselect]
# The first expected SEQUENCE: one byte, no combo, emulator-verified by David
# (mvc2_data/charselect_nodes.json, mcp/verify_grid.py: "v_down" Venom + D ->
# Hulk). The P1 cursor starts on RubyHeart; plan() walks vertical-then-horizontal.
nodes       = "charselect_nodes.json"
start       = "RubyHeart"     # ID_2 == 19 at the globe
start_id    = 19
path        = ["D", "D", "R", "R"]   # RubyHeart -> Venom
via         = "Venom"
via_id      = 14
press       = "D"
expect      = "Hulk"
expect_id   = 13
settle      = 45              # neutral frames after the globe seed before the first press (David's setup_match)

[combo]
# OUR OWN COMBO ON THE DHALSIM BASE - DC-native, authored 2026-09-18, the fixture the intent
# modules stand on (the user chose this over rebasing onto David's 2-hit result: a base that
# is TRUE and an oracle that is STRONG). Recipe: walk right 200 frames, then the magic-series
# ground chain LP > LK > HP > HK, 2-frame presses, 8 frames between press starts. Measured by
# the hunt (mode=all, d=0): peak 3 on all four phases (after F47533EF / B79A6986 / 816C0F49 /
# 89B07C85); margin gaps 7 and 9 also 3, gaps 4/6/10 drop to 2. Twelve emulator runs.
file        = "combos/dhalsim_3hit.txt"
frames      = 276
hash        = "aa67a6dcf4f9b903"   # seqHashMacro (F1's rule)
md5         = "016c040aa014f4b874380bdcde224c17"
window      = "0-276"
base        = "dhalsim_base"       # [dhalsim_base].machine_hash 5FC481A7 @ 2059
combo_peak  = 3
after_hash  = "F47533EF"           # phase 0, d 0; the other phases: B79A6986 816C0F49 89B07C85
phase_insensitive = true
measured_on = "2026-09-18 combohunt (mode=all) on [dhalsim_base] 5FC481A7; gaps 7/8/9 -> 3, 4/6/10 -> 2"

[candidate]
# The hunt's first candidate: David's human-graded, marker-bracketed window. A
# CANDIDATE until observed connecting on THIS build - PS2-converted inputs never
# become a fixture by provenance alone.
name        = "Combo_Dhalsim97_OK"
file        = "candidates/Combo_Dhalsim97_pcsx2_macro.txt"   # the ORIGIN-16 reconversion (tools/reconvert_p2m.py, 2026-09-18); rows byte-identical to David's, frame numbers = PS2 frames
source      = "davids_fly/0915/flycast-rr/mvc2_data/Dhalsim Revisited Replays/03_Boat2_Combo_Dhalsim97_OK_SS/Combo_Dhalsim97_pcsx2_macro.txt"
frames      = 6707             # FrameMax=6707 (physical 47224 from offset 16, rerecords 1646); the old copy's 6707 began 502 rows late and ran 502 into the stale tail
hash        = "dc46d3a24ab110f4"   # seqHashMacro; was 2cbafba30a4c25fc for the 502-late copy - RE-PINNED because the FILE changed (docs/PS2-SIDE.md), not to make a gate green
md5         = "4f13ed9a7fee9e5e820da4f8d1d6a3d6"
window      = "4714-6201"      # the file's CLIP LIKELY BEGINS/ENDS HERE markers (PS2 frames; the same rows the 502-late copy called 4212-5699) - trust the markers, not the burst heuristic
measured_on = "2026-09-18 tools/reconvert_p2m.py (origin 16; F1 parity dc46d3a24ab110f4, rows == the old copy shifted +502)"

[phase]
# 0..3: which of the four frameskip phases the base sits on when the candidate
# connects. The hunt sweeps all four and records the winning one here.
# `[2026-09-18]` UNMEASURED AGAIN with [result]: the four-phase insensitivity was measured on
# the harness base; on [dhalsim_base] the sweep (delays 0..30 x 4 phases) re-pins it.
# `[2026-09-18, later]` re-measured on [dhalsim_base] with [combo]: 3 hits on ALL FOUR phases
# (after F47533EF / B79A6986 / 816C0F49 / 89B07C85) - phase-insensitive again, so 0 is pinned
# as the RULE's representative (a straddling combo connects on one phase; this one on all).
value       = 0
skip_rate   = 4
# `[MEASURED 2026-09-17]` PHASE-INSENSITIVE ON THIS BASE: the hunt's `all` sweep gave
# peak=19 on all four phases, with four DISTINCT end hashes. The phase is pinned
# because the RULE stands (a straddling combo connects on one phase); this candidate
# happens to be robust to it, and the four hashes say the machine did differ.

[result]
# Pinned by TWO hashes. `after_hash` is oracle::machineHash after the candidate
# ran; `combo_peak` is Combo_Meter_HitsToOpponent's peak over the run (>= 1 is a
# hit that CONNECTED). Both are the hunt's `COMBO HUNT RESULT:` line, verbatim.
# `[MEASURED 2026-09-17]` the hunt's own line, verbatim (mode=macro, 1 candidate ran):
#   COMBO HUNT RESULT: found=yes candidate=Combo_Dhalsim97_pcsx2[4212-5699] phase=0 d=0
#                      peak=19 base=27FA5D20 after=64FF89AB
# scripts/combohunttest.sh holds every field of a fresh run against these.
#  UNMEASURED AGAIN, on purpose. The 2026-09-17 line (found=yes peak=19
# after=64FF89AB) was measured on the HARNESS base (Sonson vs Marrow, 404543fcf) -
# David's Dhalsim inputs driving Sonson: a correct picture of the wrong thing. The
# candidate file is now the origin-16 reconversion (window 4714-6201, same rows).
# These fields are re-pinned only by the hunt on [dhalsim_base] (docs/PS2-SIDE.md §5:
# setup+window, delays 0..30 x 4 phases); the first measurement there was peak 1
# (csstour finding, window only, d=0).
# `[2026-09-18, later]` MEASURED on [dhalsim_base]. The hunt's found=yes is OUR OWN combo -
# [combo] dhalsim_3hit (walk 200, LP>LK>HP>HK at 8-frame gaps): the same numbers as [combo],
# repeated here so combohunttest.sh's pins stay in the section it reads. David's Dhalsim97
# window on this base is the OPEN FINDING, not the result: peak 2 at best over d 0..10 x 4
# phases, peak 1 with his setup rows replayed (docs/PS2-SIDE.md §6) - his .p2m is inputs
# without the conditions they reacted to.
found       = "yes"
candidate   = "dhalsim_3hit.txt[0-276]"
delay       = 0
combo_peak  = 3
after_hash  = "F47533EF"
measured_on = "2026-09-18 combohunt (mode=all) on [dhalsim_base] 5FC481A7 - the [combo] author's run; David's window: peak 2 (finding)"
